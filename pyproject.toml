[project]
name = "gentbd"
version = "0.0.1"
description = "Generalised Tracking-by-Detection framework for building Online Multiple-Object Tracking (MOT) systems"
authors = [
    {name = "Mikhail Cassar",email = "m.cassar@vu.nl"},
    {name = "Mauricio Verano Merino",email = "m.verano239@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy (==1.24.3)",
    "opencv-python (==4.8.0.76)",
    "onnxruntime (==1.15.1)",
    "scipy (==1.11.2)",
    "python-dotenv (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
