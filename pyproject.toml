[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gentbd"
version = "0.1.0"
description = "Generalised Tracking-by-Detection for Multiple Object Tracking"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0, <2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
