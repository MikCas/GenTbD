# pytest configuration for GenTbD project

[tool:pytest]
# Where to look for tests
testpaths = tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options applied by default
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (must be registered)
    --strict-markers
    # Coverage report
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    # Fail if coverage below threshold (80%)
    --cov-fail-under=80

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require multiple components)
    slow: Slow tests (>1s execution time)
    gpu: Tests requiring GPU/MPS
    video: Tests requiring video files

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (prevent hanging)
timeout = 300

# Minimum Python version
minversion = 3.8
