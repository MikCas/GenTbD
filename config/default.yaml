# GenTbD Default Configuration

# Video source settings
video:
  source: "data/TownCent.mp4"  # Path to video file, camera index (0, 1), or RTSP URL
  max_dimension: null          # Resize frames to max dimension (null = no resize)
  skip_frames: 1               # Process every Nth frame (1 = all frames)
  save_output: false           # Save processed video
  output_path: null            # Output path (null = auto-generate)

# Detection settings
detection:
  type: "object"               # Detector type: "object", "keypoint", or "reid"
  model: "mobilenet"           # Model: resnet50, mobilenet, retinanet (for object)
                               #        resnet50 (for keypoint)
                               #        osnet_x1_0, osnet_x0_75, osnet_x0_5, resnet50 (for reid)
  device: "cpu"                # Device: cpu, mps, cuda
  conf_threshold: 0.5          # Confidence threshold (0.0-1.0)
  classes: null                # Filter classes (null = all, [1] = people only)
                               # Note: keypoint detector only detects people

  # Keypoint-specific settings (when type = "keypoint")
  keypoint:
    keypoint_threshold: 0.5    # Minimum visibility for individual keypoints
    draw_skeleton: true        # Draw skeleton connections between keypoints
    draw_keypoints: true       # Draw keypoint circles
    keypoint_radius: 4         # Radius of keypoint circles
    skeleton_thickness: 2      # Thickness of skeleton lines

  # ReID-specific settings (when type = "reid")
  reid:
    embedding_dim: 512         # Embedding dimension (512 for OSNet models)

# Tracking settings (for future implementation)
tracking:
  enabled: false               # Enable tracking
  tracker_type: "bytetrack"    # Tracker: bytetrack, sort, deepsort
  max_age: 30                  # Frames to keep lost tracks
  min_hits: 3                  # Minimum detections before track confirmed
  iou_threshold: 0.3           # IoU threshold for matching

  # ReID settings
  reid:
    enabled: false             # Enable ReID feature matching
    model: null                # ReID model path (null = use default)
    weight: 0.5                # ReID weight vs IoU (0.0-1.0)

# Logging
logging:
  verbose: false               # Enable verbose logging
